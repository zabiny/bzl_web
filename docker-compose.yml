# Runs the site. Content lives in ./data, mounted as a volume, so publishing a
# new result or adding a race is a file change plus `docker compose restart` -
# no image rebuild.
services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: bzl_web
    container_name: bzl_web
    restart: unless-stopped
    ports:
      - "5099:5099"
    environment:
      # Get a key at https://developer.mapy.com/account/ (free tier is ample).
      # Without it the event pages show a link to Mapy.com instead of a map.
      MAPY_API_KEY: "${MAPY_API_KEY:-}"
      BZL_LOG_LEVEL: "${BZL_LOG_LEVEL:-INFO}"
    volumes:
      - ./data:/web/data
      - ./templates/news:/web/templates/news
      - oris-cache:/var/cache/bzl

volumes:
  oris-cache:
