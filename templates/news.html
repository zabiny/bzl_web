{% extends 'layout.html' %}

{% block page_title %}Novinky{% endblock %}

{% block body %}
<div class="page-content">
    {% for news_item in news %}
    <article class="news-item">
        {% if news_item.title %}
        <h2 class="mb-3 mt-5">{{ news_item.title }}</h2>
        {% endif %}
        <div class="news-meta">
            <time class="news-date" datetime="{{ news_item.created_at.isoformat() }}">
                {{ news_item.created_at.strftime('%d.%m.%Y') }}
            </time>
        </div>
        <div class="news-content">
            {{ news_item.get_rendered_content() | safe }}
        </div>
    </article>
    {% endfor %}
</div>
{% endblock %}
